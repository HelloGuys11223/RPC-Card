<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kizzey Presence Card</title>
  <style>
    body {
      background-color: #0e0e10;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .kizzey-card {
      background-color: #111214;
      border: 1px solid #232428;
      border-radius: 16px;
      padding: 20px;
      width: 360px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .card-info { display: flex; flex-direction: column; gap: 4px; max-width: 240px; }
    .status-type { font-size: 0.7rem; font-weight: 700; color: #949ba4; text-transform: uppercase; }
    .title { font-size: 1rem; font-weight: 700; color: #f2f3f5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .details, .state { font-size: 0.85rem; color: #b5bac1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .state-highlight { color: #23a55a; font-weight: 600; }
    .timer { font-size: 0.75rem; color: #1db954; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
    .footer { margin-top: 6px; font-size: 0.7rem; color: #80848e; display: flex; align-items: center; gap: 5px; }
    .card-icon { width: 76px; height: 76px; border-radius: 12px; object-fit: cover; margin-left: 12px; display: none; }
  </style>
</head>
<body>

  <div class="kizzey-card">
    <div class="card-info">
      <div class="status-type" id="status-type">STATUS</div>
      <div class="title" id="status-title">Connecting...</div>
      <div class="details" id="status-details">Establishing real-time link</div>
      <div class="state state-highlight" id="status-state"></div>
      <div class="timer" id="status-timer"></div>
      <div class="footer">Template from Kizzey</div>
    </div>
    <img id="card-image" class="card-icon" src="" alt="" onerror="this.style.display='none'" />
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const DEFAULT_USER_ID = "1167583899409465377";
    const USER_ID = urlParams.get("id") || DEFAULT_USER_ID;
    
    const WS_URL = "wss://api.lanyard.rest/socket";

    const activityTypes = { 0: "PLAYING", 1: "STREAMING", 2: "LISTENING TO", 3: "WATCHING", 4: "CUSTOM STATUS", 5: "COMPETING IN" };

    let activeTimestamps = null;
    let heartbeatInterval = null;
    let ws = null;

    function formatMs(ms) {
      if (isNaN(ms) || ms < 0) return "0:00";
      const totalSec = Math.floor(ms / 1000);
      const min = Math.floor(totalSec / 60);
      const sec = Math.floor(totalSec % 60);
      return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    function updateTimer() {
      const timerEl = document.getElementById("status-timer");
      if (!activeTimestamps || !activeTimestamps.start) {
        timerEl.innerText = "";
        return;
      }
      const elapsedMs = Math.max(0, Date.now() - activeTimestamps.start);
      if (activeTimestamps.end) {
        const totalMs = activeTimestamps.end - activeTimestamps.start;
        timerEl.innerText = `${formatMs(elapsedMs)} / ${formatMs(totalMs)}`;
      } else {
        timerEl.innerText = `${formatMs(elapsedMs)} elapsed`;
      }
    }

    function getImageUrl(data, act) {
      if (data.listening_to_spotify && data.spotify?.album_art_url) return data.spotify.album_art_url;
      if (!act || !act.assets) return null;
      const asset = act.assets.large_image || act.assets.small_image;
      if (!asset) return null;

      if (asset.startsWith("spotify:")) return `https://i.scdn.co/image/${asset.replace("spotify:", "")}`;
      if (asset.startsWith("mp:external/")) {
        if (asset.includes("/https/")) return "https://" + asset.substring(asset.indexOf("/https/") + 7);
        if (asset.includes("/http/")) return "http://" + asset.substring(asset.indexOf("/http/") + 6);
        return `https://media.discordapp.net/external/${asset.replace("mp:external/", "")}`;
      }
      if (act.application_id) return `https://cdn.discordapp.com/app-assets/${act.application_id}/${asset}.png`;
      return null;
    }

    function renderPresence(data) {
      const typeEl = document.getElementById("status-type");
      const titleEl = document.getElementById("status-title");
      const detailsEl = document.getElementById("status-details");
      const stateEl = document.getElementById("status-state");
      const imgEl = document.getElementById("card-image");

      if (!data) {
        typeEl.innerText = "USER NOT FOUND";
        titleEl.innerText = "Not Monitored";
        detailsEl.innerText = "Join discord.gg/lanyard";
        stateEl.innerText = "UNTRACKED";
        imgEl.style.display = "none";
        return;
      }

      if (data.listening_to_spotify) {
        typeEl.innerText = "LISTENING TO SPOTIFY";
        titleEl.innerText = data.spotify.song;
        detailsEl.innerText = `by ${data.spotify.artist}`;
        stateEl.innerText = data.spotify.album;
        activeTimestamps = { start: data.spotify.timestamps?.start, end: data.spotify.timestamps?.end };
        const imgUrl = getImageUrl(data, null);
        if (imgUrl) { imgEl.src = imgUrl; imgEl.style.display = "block"; } else { imgEl.style.display = "none"; }
      } else if (data.activities && data.activities.length > 0) {
        const act = data.activities.find(a => a.type !== 4) || data.activities[0];
        activeTimestamps = act.timestamps || null;

        if (act.type === 4) {
          typeEl.innerText = "CUSTOM STATUS";
          titleEl.innerText = act.state || act.name;
          detailsEl.innerText = act.emoji ? act.emoji.name : "";
          stateEl.innerText = (data.discord_status || "ONLINE").toUpperCase();
          imgEl.style.display = "none";
        } else {
          typeEl.innerText = `${activityTypes[act.type] || "ACTIVITY"} ${act.name.toUpperCase()}`;
          titleEl.innerText = act.details || act.name;
          detailsEl.innerText = act.details ? (act.state || "") : "";
          stateEl.innerText = act.state || "Active";
          const imgUrl = getImageUrl(data, act);
          if (imgUrl) { imgEl.src = imgUrl; imgEl.style.display = "block"; } else { imgEl.style.display = "none"; }
        }
      } else {
        typeEl.innerText = "DISCORD STATUS";
        titleEl.innerText = "No Active Activity";
        detailsEl.innerText = "Online";
        stateEl.innerText = (data.discord_status || "ONLINE").toUpperCase();
        activeTimestamps = null;
        imgEl.style.display = "none";
      }
      updateTimer();
    }

    function connectWebSocket() {
      ws = new WebSocket(WS_URL);
      ws.onmessage = (event) => {
        const message = JSON.parse(event.data);
        if (message.op === 1) {
          if (heartbeatInterval) clearInterval(heartbeatInterval);
          heartbeatInterval = setInterval(() => { if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ op: 3 })); }, message.d.heartbeat_interval);
          ws.send(JSON.stringify({ op: 2, d: { subscribe_to_id: USER_ID } }));
        }
        if (message.op === 0 && message.d) renderPresence(message.d);
      };
      ws.onclose = () => setTimeout(connectWebSocket, 3000);
    }

    connectWebSocket();
    setInterval(updateTimer, 1000);
  </script>
</body>
</html>
